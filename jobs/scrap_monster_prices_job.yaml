job_name: scrap_monster_prices
script: scrapers.scrap_monster_prices
# Weekly on Monday at 03:00 — prices update on a rolling monthly basis.
schedule: "0 3 * * 1"

output:
  type: csv
  path: data/scrap_monster/prices.csv
  # Tidy rows: one per commodity, market (region) and date. Re-runs update
  # existing rows in place and add new dates.
  key: [commodity, region, date]
  export: all        # CSV holds the full stored history, not just the latest run

validation:
  min_rows: 1
  # Marker rows ({"status": "error" | "no_data", ...}) lack these fields and fail the run.
  required_fields: [commodity, region, date, price]
  types:
    price: number

retry:
  retries: 3
  retry_delay: 60

# Applies to the page fetch and every chart request (per domain, shared with other jobs).
rate_limit:
  rate_limit: 10
  delay_min: 2
  delay_max: 5

parameters:
  # ── Commodity pages ────────────────────────────────────────────────────────
  # Each page lists several markets (e.g. EXW China, FOB China, Port India,
  # Warehouse Rotterdam, Warehouse Baltimore); the scraper returns the full
  # history of every one of them, tagged with `region` and `unit`.
  # Units differ between regions (MT, Kg, Lb) — compare within a unit only.
  urls:
    - "https://www.scrapmonster.com/metal-prices/antimony-ingot-9965-min-price/655"
  #   - "https://www.scrapmonster.com/metal-prices/base-metals/copper/869"

  # Optional: limit to some markets (tab labels or region ids). Default: all.
  # regions: ["EXW China", "FOB China"]

  # Plain HTTP works today. If the site starts blocking it, set this to open a
  # visible browser and solve the CAPTCHA (not suitable for unattended runs).
  # browser: true
