job_name: worldbank_precious_metals
script: scrapers.worldbank_pink_sheet
# On siimpli this job is run monthly by the server's
# jobs/monthly/015_load_scraped_metal_prices.py, which loads its rows into
# external_metal_price (see CLAUDE.md, "Metal price jobs loaded by siimpli").
# The schedule below only applies to a local `scheduler`.
# The World Bank publishes the Pink Sheet in the first days of each month.
schedule: "0 5 5 * *"

output:
  type: csv
  path: data/worldbank/precious_metals.csv
  # One row per metal and month.
  key: [commodity, market, date]
  export: all

validation:
  # Three metals, monthly since 1960: about 800 months each.
  min_rows: 2000
  required_fields: [metal, commodity, market, unit, date, price]
  types:
    price: number

retry:
  retries: 2
  retry_delay: 60

rate_limit:
  rate_limit: 10
  delay_min: 1
  delay_max: 2
  respect_robots: true

# Two requests: the landing page and a workbook of about 1 MB.
timeout_seconds: 600
isolate: true

parameters:
  metals: [gold, platinum, silver]
